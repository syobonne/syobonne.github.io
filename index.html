<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>(´･ω･`)🎤 ショボンヌ SONG LIST</title>
<style>
:root{
  --bg:#f7f8fb;--panel:#fff;--text:#20252d;--muted:#6b7280;
  --line:#e3e7ee;--accent:#4f8fd9;--ok:#159957;--warn:#c98a00;--bad:#d84a5a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.wrap{max-width:900px;margin:auto;padding:18px 14px 80px}
header{padding:10px 4px 18px}
h1{font-size:27px;margin:0 0 6px;font-weight:800}
.sub{color:var(--muted);font-size:14px}
.today{background:var(--panel);border:1px solid var(--line);border-radius:16px;
padding:16px;margin:8px 0 14px;box-shadow:0 2px 10px #00000008}
.today-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.today-title{font-weight:800;font-size:18px}
.today-btn{border:0;border-radius:999px;background:var(--accent);color:white;
font-weight:800;padding:10px 15px;font-size:14px}
.today-song{margin-top:13px;padding:13px;border-radius:12px;background:#f1f6fd;display:none}
.today-song.show{display:block}
.today-song .songtitle{font-size:21px;font-weight:800}
.today-song .artist{color:var(--accent);margin-top:3px}
.today-song .details{color:var(--muted);font-size:13px;margin-top:8px}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.search{width:100%;margin-bottom:10px}
input,select,button{font:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);
border-radius:10px;background:#fff;color:var(--text)}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.actions{display:flex;gap:8px;margin-top:9px}
.actions button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 4px}
.pill{padding:5px 9px;border-radius:999px;background:#eef1f5;color:var(--muted);font-size:12px}
.pill b{color:var(--text)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:end;margin:15px 2px 7px}
.count{font-size:13px;color:var(--muted)}
.list{display:grid;gap:8px}
.song{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 14px;position:relative}
.title{font-size:17px;font-weight:750}
.song-actions{display:flex;justify-content:flex-end;margin-top:-28px;margin-bottom:10px}
.copy-btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:700}
.copy-btn.copied{color:var(--ok);border-color:#b9dfc9}
.artist{color:var(--accent);font-size:14px;margin-top:3px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;color:var(--muted);background:#f5f6f8;border:1px solid var(--line);
padding:4px 7px;border-radius:7px}
.status{font-weight:700}
.ok{color:var(--ok)}.practice{color:var(--warn)}.ng{color:var(--bad)}
.memo{color:#596273;font-size:13px;margin-top:7px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
@media(max-width:650px){
  .filters{grid-template-columns:1fr 1fr}
  .filters select:last-child{grid-column:1/-1}
  h1{font-size:24px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>(´･ω･`)🎤 ショボンヌ SONG LIST</h1>
  <div class="sub">配信中に歌いたい曲をサッと探せるシンプル版</div>
</header>

<section class="today">
  <div class="today-head">
    <div class="today-title">🎲 今日の1曲</div>
    <button class="today-btn" id="random">ランダムで決める</button>
  </div>
  <div class="today-song" id="todaySong"></div>
</section>

<section class="controls">
  <div class="search">
    <input id="q" placeholder="曲名・歌手を検索…">
  </div>
  <div class="filters">
    <select id="status">
      <option value="">状態：すべて</option>
      <option>🔵OK</option>
      <option>🟡練習中</option>
      <option>🔴NG</option>
    </select>
    <select id="genre"><option value="">ジャンル：すべて</option></select>
    <select id="sort">
      <option value="artist">アーティスト順</option>
      <option value="title">曲名順</option>
      <option value="pop">人気度順</option>
    </select>
  </div>
  <div class="actions">
    <button id="clear">検索・絞り込みをリセット</button>
  </div>
  <div class="stats" id="stats"></div>
</section>

<div class="top">
  <div class="count" id="count"></div>
  <div class="count">全曲リスト</div>
</div>
<main class="list" id="list"></main>
</div>

<script>
let songs=[], filtered=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function cls(s){return s.includes('OK')?'ok':s.includes('練習')?'practice':'ng'}

function init(){
  const gs=[...new Set(songs.map(x=>x['ジャンル']).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,'ja'));
  gs.forEach(g=>{
    const o=document.createElement('option');
    o.value=g;o.textContent=g;$('genre').append(o);
  });
  render();
}

function render(){
  const q=$('q').value.trim().toLowerCase();
  const g=$('genre').value;
  const st=$('status').value;
  const so=$('sort').value;

  filtered=songs.filter(x=>
    (!q||[x['曲名'],x['アーティスト'],x['メモ']].join(' ').toLowerCase().includes(q)) &&
    (!g||x['ジャンル']===g) &&
    (!st||x['リクエスト']===st)
  );

  filtered.sort((a,b)=>
    so==='title'
      ? a['曲名'].localeCompare(b['曲名'],'ja')
      : so==='pop'
        ? Number(b['人気度']||0)-Number(a['人気度']||0)||a['曲名'].localeCompare(b['曲名'],'ja')
        : a['アーティスト'].localeCompare(b['アーティスト'],'ja')||a['曲名'].localeCompare(b['曲名'],'ja')
  );

  $('count').textContent=`${filtered.length}曲 / 全${songs.length}曲`;
  $('stats').innerHTML=[
    ['🔵OK',songs.filter(x=>x['リクエスト']==='🔵OK').length],
    ['🟡練習中',songs.filter(x=>x['リクエスト']==='🟡練習中').length],
    ['🔴NG',songs.filter(x=>x['リクエスト']==='🔴NG').length]
  ].map(a=>`<span class="pill">${a[0]} <b>${a[1]}</b></span>`).join('');

  $('list').innerHTML=filtered.length ? filtered.map(x=>`
    <article class="song">
      <div class="title">${esc(x['曲名'])}</div>
      <div class="artist">${esc(x['アーティスト'])}</div>
      <div class="song-actions">
        <button class="copy-btn" onclick="copySong(event, ${JSON.stringify(String(x['曲名']||''))}, ${JSON.stringify(String(x['アーティスト']||''))})">📋 コピー</button>
      </div>
      <div class="meta">
        <span class="tag status ${cls(x['リクエスト'])}">${esc(x['リクエスト'])}</span>
        ${x['ジャンル']?`<span class="tag">${esc(x['ジャンル'])}</span>`:''}
        ${x['キー']?`<span class="tag">キー ${esc(x['キー'])}</span>`:''}
        ${x['人気度']&&x['人気度']!=='0'?`<span class="tag">人気度 ${esc(x['人気度'])}</span>`:''}
      </div>
      ${x['メモ']?`<div class="memo">${esc(x['メモ'])}</div>`:''}
    </article>`).join('')
    : '<div class="empty">条件に合う曲がありません🥲</div>';
}

async function copySong(event,title,artist){
  const text = `${title} / ${artist}`;
  const btn = event.currentTarget;
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  const old=btn.textContent;
  btn.textContent='✓ コピーしました';
  btn.classList.add('copied');
  setTimeout(()=>{btn.textContent=old;btn.classList.remove('copied')},1200);
}

function showRandom(){
  if(!filtered.length){
    $('todaySong').innerHTML='<div>現在の絞り込み条件では選べる曲がありません。</div>';
    $('todaySong').classList.add('show');
    return;
  }
  const x=filtered[Math.floor(Math.random()*filtered.length)];
  $('todaySong').innerHTML=`
    <div class="songtitle">${esc(x['曲名'])}</div>
    <div class="artist">${esc(x['アーティスト'])}</div>
    <div class="details">
      ${esc(x['リクエスト'])}
      ${x['ジャンル']?' ・ '+esc(x['ジャンル']):''}
      ${x['キー']?' ・ キー '+esc(x['キー']):''}
      ${x['メモ']?' ・ '+esc(x['メモ']):''}
    </div>`;
  $('todaySong').classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}

['q','genre','status','sort'].forEach(id=>$(id).addEventListener('input',render));
$('clear').onclick=()=>{
  $('q').value='';$('genre').value='';$('status').value='';$('sort').value='artist';
  render();
};
$('random').onclick=showRandom;

fetch('songs.json')
  .then(r=>r.json())
  .then(d=>{songs=d;init()})
  .catch(()=>{$('list').innerHTML='<div class="empty">曲データを読み込めませんでした。</div>'});
</script>
</body>
</html>
