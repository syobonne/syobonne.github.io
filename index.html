<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>ショボンヌ🎤 選曲リスト</title>
<style>
:root{--bg:#08111f;--panel:#101b2e;--panel2:#16243b;--text:#eef5ff;--muted:#9fb0c7;--accent:#66b3ff;--ok:#39d98a;--warn:#ffd166;--bad:#ff6b7a;--line:#263752}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101d,#0c1728 55%,#08111f);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 14px 50px}.hero{padding:22px 18px 16px}.brand{font-size:28px;font-weight:800;letter-spacing:.02em}.sub{color:var(--muted);margin-top:4px}.controls{position:sticky;top:0;z-index:5;background:rgba(8,17,31,.92);backdrop-filter:blur(12px);padding:12px 0;border-bottom:1px solid var(--line)}.row{display:flex;gap:8px;flex-wrap:wrap}.search{flex:1;min-width:220px}input,select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}input{width:100%}button{cursor:pointer}button.active{border-color:var(--accent);background:#142b47}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{padding:6px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:13px}.pill b{color:var(--text)}.list{display:grid;gap:8px;margin-top:12px}.song{background:rgba(16,27,46,.92);border:1px solid var(--line);border-radius:13px;padding:13px 14px;display:grid;grid-template-columns:1fr auto;gap:10px}.title{font-size:17px;font-weight:750}.artist{color:var(--accent);font-size:14px;margin-top:3px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{font-size:12px;color:var(--muted);background:#0b1525;border:1px solid var(--line);padding:4px 7px;border-radius:7px}.status{font-weight:700}.ok{color:var(--ok)}.practice{color:var(--warn)}.ng{color:var(--bad)}.memo{color:#c8d4e6;font-size:13px;margin-top:7px}.empty{text-align:center;color:var(--muted);padding:40px 10px}.random{position:fixed;right:18px;bottom:18px;border:0;border-radius:999px;background:var(--accent);color:#06101c;font-weight:800;padding:14px 18px;box-shadow:0 8px 30px #0008}.count{color:var(--muted);font-size:13px;margin:8px 2px}.top{display:flex;justify-content:space-between;gap:10px;align-items:end}.small{font-size:12px;color:var(--muted)}@media(max-width:600px){.hero{padding-left:4px}.brand{font-size:24px}.song{grid-template-columns:1fr}.random{right:12px;bottom:12px}}
</style></head><body><div class="wrap"><section class="hero"><div class="brand">(´･ω･`)🎤 ショボンヌ選曲リスト</div><div class="sub">歌える曲を、配信中にサッと探せるシンプル版</div></section><section class="controls"><div class="row"><div class="search"><input id="q" placeholder="曲名・アーティスト・メモを検索…"></div><select id="genre"><option value="">ジャンル：すべて</option></select><select id="status"><option value="">状態：すべて</option><option>🔵OK</option><option>🟡練習中</option><option>🔴NG</option></select><select id="sort"><option value="artist">アーティスト順</option><option value="title">曲名順</option><option value="pop">人気度順</option></select><button id="clear">リセット</button></div><div class="stats" id="stats"></div></section><div class="top"><div class="count" id="count"></div><div class="small">スマホ対応 / 232曲収録</div></div><main class="list" id="list"></main></div><button class="random" id="random">🎲 ランダム選曲</button>
<script>
let songs=[];let filtered=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function cls(s){return s.includes('OK')?'ok':s.includes('練習')?'practice':'ng'}
function init(){const gs=[...new Set(songs.map(x=>x['ジャンル']).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));gs.forEach(g=>{let o=document.createElement('option');o.value=g;o.textContent=g;$('genre').append(o)});render()}
function render(){let q=$('q').value.trim().toLowerCase(),g=$('genre').value,st=$('status').value,so=$('sort').value;filtered=songs.filter(x=>(!q||[x['曲名'],x['アーティスト'],x['メモ']].join(' ').toLowerCase().includes(q))&&(!g||x['ジャンル']===g)&&(!st||x['リクエスト']===st));filtered.sort((a,b)=>so==='title'?a['曲名'].localeCompare(b['曲名'],'ja'):so==='pop'?Number(b['人気度']||0)-Number(a['人気度']||0)||a['曲名'].localeCompare(b['曲名'],'ja'):a['アーティスト'].localeCompare(b['アーティスト'],'ja')||a['曲名'].localeCompare(b['曲名'],'ja'));$('count').textContent=`${filtered.length}曲 / 全${songs.length}曲`;$('stats').innerHTML=[['🔵OK',songs.filter(x=>x['リクエスト']==='🔵OK').length],['🟡練習中',songs.filter(x=>x['リクエスト']==='🟡練習中').length],['🔴NG',songs.filter(x=>x['リクエスト']==='🔴NG').length]].map(a=>`<span class="pill">${a[0]} <b>${a[1]}</b></span>`).join('');$('list').innerHTML=filtered.length?filtered.map(x=>`<article class="song"><div><div class="title">${esc(x['曲名'])}</div><div class="artist">${esc(x['アーティスト'])}</div><div class="meta"><span class="tag status ${cls(x['リクエスト'])}">${esc(x['リクエスト'])}</span>${x['ジャンル']?`<span class="tag">${esc(x['ジャンル'])}</span>`:''}${x['キー']?`<span class="tag">キー ${esc(x['キー'])}</span>`:''}${x['人気度']&&x['人気度']!=='0'?`<span class="tag">人気度 ${esc(x['人気度'])}</span>`:''}</div>${x['メモ']?`<div class="memo">${esc(x['メモ'])}</div>`:''}</div></article>`).join(''):'<div class="empty">条件に合う曲がありません🥲</div>'}
['q','genre','status','sort'].forEach(id=>$(id).addEventListener('input',render));$('clear').onclick=()=>{$('q').value='';$('genre').value='';$('status').value='';$('sort').value='artist';render()};$('random').onclick=()=>{if(!filtered.length)return;let x=filtered[Math.floor(Math.random()*filtered.length)];alert(`🎤 ランダム選曲\n\n${x['曲名']}\n${x['アーティスト']}\n${x['リクエスト']}${x['キー']?'\nキー：'+x['キー']:''}`)};
fetch('songs.json').then(r=>r.json()).then(d=>{songs=d;init()});
</script></body></html>
